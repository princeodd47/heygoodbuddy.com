# Squads on the Unicorn Overlord Post-Game Teams page.
# squads: the ten squads you field together. others: alternative community builds.
# Each unit lists its row (front or back, at most 3 each), class, 4 items and its
# Tactics in priority order (skills not listed are off). start says which
# start-of-battle skill to keep on and which to turn off.
# Check with: python scripts/uo_teams_check.py
squads:
- title: '1. Alain: Trinity Rain'
  about: A magic nuke that hits the whole enemy side three times before most enemies act. Yahna starts the battle with Quick Cast, Sanatio's White Cat-Ear Hood lets her act again right away so the charge skips a turn, and Scarlett's Familiar's Choker adds +50% magic attack to the cast. The Sniper's Amber Lens gives Yahna Hawk Eye, so the cast is a truestrike and a guaranteed crit and can't be dodged. Alain and Celeste clean up and tank.
  units:
  - name: Alain
    class: High Lord
    row: front
    equipment: [Holy Unicorn Blade, Holy Unicorn Shield, Ring of the Unicorn, Lapis Pendant]
    tactics:
    - {type: active, skill: Spinning Edge, when: Row with 2 or more enemies}
    - {type: active, skill: Lean Edge, when: Lowest HP enemy}
    - {type: passive, skill: Luminous Cover, when: Back row}
    - {type: passive, skill: Noble Guard, when: None}
  - name: Celeste
    class: Gryphon Master
    row: front
    equipment: [Boreas' Axe, Heavenwyvern Reins, Elite Beret, Royal Scarf]
    tactics:
    - {type: active, skill: High Swing, when: Back row}
    - {type: active, skill: Aerial Smite, when: Lowest HP enemy}
    - {type: passive, skill: Gryphon Glide, when: None}
  - name: Scarlett
    class: High Priestess
    row: back
    equipment: [Kingstaff Albiore, Familiar's Choker, Carnelian Pendant, Lapis Pendant]
    tactics:
    - {type: active, skill: Curing Call, when: Anyone below 75% HP}
    - {type: passive, skill: Sorcerous Connection, when: Target Yahna}
  - name: Yahna
    class: Sorceress
    row: back
    equipment: [Millennium Scepter, Sniper's Amber Lens, Sapphire Pendant, Carnelian Pendant]
    tactics:
    - {type: active, skill: Trinity Rain, when: None}
    - {type: passive, skill: Quick Cast, when: Start of battle}
    - {type: passive, skill: Hawk Eye, when: None}
  - name: Sanatio
    class: Featherstaff
    row: back
    equipment: [Euros' Staff, White Cat-Ear Hood, Lapis Pendant, Holy Unicorn Signet]
    tactics:
    - {type: active, skill: Overheal, when: Anyone below 75% HP}
    - {type: passive, skill: Quick Impetus, when: Target Yahna}
  start:
    keep: {unit: Yahna, skill: Quick Cast}
    'off':
    - {unit: Alain, skill: Rapid Order}
    - {unit: Scarlett, skill: Divine Blessing}
    - {unit: Sanatio, skill: Hastened Heal}
  notes: Quick Cast (2 PP) and Hawk Eye (2 PP) use all 4 of Yahna's PP. Hawk Eye's guaranteed crit overrides Quick Cast's -50% crit rate. Check in a mock battle that Hawk Eye fires on the cast itself, not when Yahna starts charging. Quick Impetus costs 4 PP, so Sanatio needs the Hood and the Lapis Pendant to reach it. If the enemy has a Thief with Sneaking Edge, check that a barrier doesn't use up her PP first.
- title: '2. Hilda: Dragoon Dive'
  about: Hilda's Dragoon Dive with a fast charge. The Celestial Talisman gives her Hastened Charge, so the dive comes out on her first turn. Ochlys's Dancer's Bracelet buffs her attack before each dive, Raenys's Tailwind makes her act sooner, and Lex blocks the archers that would ground the flyers.
  units:
  - name: Ochlys
    class: Feathersword
    row: front
    equipment: [Heavenswing Sword, Heavenswing Shield, Dancer's Bracelet, Royal Scarf]
    tactics:
    - {type: active, skill: Shield Smite, when: Armored}
    - {type: active, skill: Spiral Sword, when: None}
    - {type: passive, skill: Powerful Call, when: Target Hilda}
  - name: Lex
    class: Vanguard
    row: front
    equipment: [Meteorite Sword, Unyielding Shield, Cloth Gauntlets, Lapis Pendant]
    tactics:
    - {type: active, skill: Defender, when: Lowest evasion}
    - {type: passive, skill: Arrow Cover, when: Flying ally}
  - name: Hilda
    class: Wyvern Master
    row: back
    equipment: [Dragoon's Warspear, Celestial Talisman, Sapphire Pendant, Carnelian Pendant]
    tactics:
    - {type: active, skill: Dragoon Dive, when: None}
    - {type: active, skill: Diving Thrust, when: Lowest HP enemy}
    - {type: passive, skill: Hastened Charge, when: Start of battle}
  - name: Raenys
    class: Featherbow
    row: back
    equipment: [Apeliotes' Bow, Raven Plume, Lapis Pendant, Clearsight Amulet]
    tactics:
    - {type: active, skill: Photon Arrow, when: None}
    - {type: active, skill: attack, when: Flying or cavalry}
    - {type: passive, skill: Tailwind, when: None}
  - name: Ramona
    class: Wereowl
    row: back
    equipment: [Papal Crosier, Lapis Pendant, Gold Bangle, Ancient Crown]
    tactics:
    - {type: active, skill: Extra Heal, when: Anyone below 75% HP}
    - {type: active, skill: Aurora Veil, when: None}
    - {type: passive, skill: Restore, when: Target Ochlys}
  start:
    keep: {unit: Hilda, skill: Hastened Charge}
    'off':
    - {unit: Lex, skill: Provoke}
    - {unit: Hilda, skill: Dragon's Roar}
  notes: |-
    Restore gives back 1 PP after an ally uses a passive. Aimed at Ochlys, it keeps Powerful Call going for later dives.

    Hastened Charge costs 4 PP and the Talisman lowers Hilda's AP by 1, so the two pendants are there to keep her points up. Photon Arrow goes first so Tailwind triggers before Hilda's turn.

    Hastened Charge uses all 4 of Hilda's PP, so she has none left for Aerial Wing. That's why the Heavenwyvern Reins stay with Celeste. Dragoon Dive isn't a truestrike, so an evasive enemy can still dodge it. Check the forecast against Thieves and Werefoxes.
- title: '3. Yunifi: Glacial Rain'
  about: Yunifi's Glacial Rain hits every enemy three times and freezes them. It's a charge skill, so Travis's Black Cat-Ear Hood fires Quick Impetus as she starts charging and she casts it right away. Lhinalagos's Gambler's Coin gives her Inspiration (+30% attack, +50% crit damage), and her own Eagle Eye makes the hit true, so Inspiration's accuracy penalty doesn't matter. Bryce and Morard hold the front. Dispel is the hard counter to this squad, so watch for enemy Wereowls.
  units:
  - name: Bryce
    class: Legionnaire
    row: front
    equipment: [Meteorite Lance, Drakestone Iceshield, Knight's Medallion, Detoxifying Amulet]
    tactics:
    - {type: active, skill: Row attack, when: Row with 2 or more enemies}
    - {type: passive, skill: Heavy Cover, when: Lowest HP ally}
  - name: Morard
    class: Werelion
    row: front
    equipment: [Meteorite Axe, Warrior's Medallion, Leaf Broach, Carnelian Pendant]
    tactics:
    - {type: active, skill: Row attack, when: Row with 2 or more enemies}
    - {type: active, skill: Single-target attack, when: Lowest HP enemy}
  - name: Yunifi
    class: Snow Ranger
    row: back
    equipment: [Kingsbow Bastorik, Angel Plume, Warrior's Medallion, Watchman's Lantern]
    tactics:
    - {type: active, skill: Glacial Rain, when: None}
    - {type: active, skill: Sonic Shaft, when: Flying}
    - {type: active, skill: Mystic Arrow, when: Armored}
    - {type: passive, skill: Eagle Eye, when: None}
  - name: Travis
    class: Rogue
    row: back
    equipment: [Cutthroat's Boon, Black Cat-Ear Hood, Lapis Pendant, Royal Scarf]
    tactics:
    - {type: active, skill: Shadow Bite, when: Row with 2 or more enemies}
    - {type: passive, skill: Quick Impetus, when: Target Yunifi}
    - {type: passive, skill: Evade, when: None}
  - name: Lhinalagos
    class: Elven Archer
    row: back
    equipment: [Sacral Bow, Gambler's Coin, Lapis Pendant, Sage's Hood]
    tactics:
    - {type: active, skill: Icicle Arrow, when: Flying}
    - {type: passive, skill: Pure Field, when: Start of battle}
    - {type: passive, skill: Inspiration, when: Target Yunifi}
  start:
    keep: {unit: Lhinalagos, skill: Pure Field}
    'off':
    - {unit: Travis, skill: Sneaking Edge}
- title: '4. Virginia and Berengaria: Affliction Squad'
  about: Corvie Indo's squad, kept as built. Everything inflicts or punishes afflictions. Berengaria's Death Spin stuns a row and does 75% more to afflicted enemies, so she snowballs once anything is burned, frozen, stunned or blinded. Virginia tanks and smashes armor, Dinah blinds whole columns and Monica heals.
  units:
  - name: Virginia
    class: Valkyria
    row: front
    equipment: [Hallowed Blade, Blue Rose Shield, Azure Crest Shield, Vengeful Caligae]
    tactics:
    - {type: active, skill: Vertical Edge, when: Flying}
    - {type: active, skill: Iron Crusher, when: Armored}
    - {type: active, skill: Brandish, when: None}
    - {type: active, skill: Iron Crusher, when: Own AP too low for Brandish}
    - {type: passive, skill: Vengeful Impetus, when: Own AP 3 or less}
    - {type: passive, skill: Royal Guard, when: Ally below 50% HP}
    - {type: passive, skill: Maiden's Hammer, when: Own PP 3 or more}
    - {type: passive, skill: Undying Will, when: Every second action}
  - name: Berengaria
    class: Dark Marquess
    row: front
    equipment: [Kingsaxe Drakenash, Mirage Greatshield, Earrings of Pursuit, Ring of the Maiden]
    tactics:
    - {type: active, skill: Death Spin, when: Row with 2 or more enemies}
    - {type: active, skill: Vicious Torment, when: Afflicted}
    - {type: active, skill: Carnage, when: None}
    - {type: passive, skill: Painbringer, when: Own PP 2 or more}
    - {type: passive, skill: Eye of the Warrior Princess, when: Start of battle}
    - {type: passive, skill: Sanguine Pursuit, when: Afflicted only}
  - name: Dinah
    class: Werefox
    row: front
    equipment: [Corroded Spear, Lionheart, Carnelian Pendant, Lapis Pendant]
    tactics:
    - {type: active, skill: Passive Hold, when: 'Armored, not passive-sealed'}
    - {type: active, skill: Shadow Thrust, when: 'Full column, not blinded'}
    - {type: active, skill: Shadow Thrust, when: Not blinded}
    - {type: active, skill: Piercing Lance, when: None}
    - {type: passive, skill: Shadow Pursuit, when: Not blinded}
    - {type: passive, skill: Nocturnal Evade, when: None}
  - name: Railanor
    class: Elven Fencer
    row: back
    equipment: [Spellsteel Sword, Sorcerer's Medallion, Sage's Hood, Royal Scarf]
    tactics:
    - {type: active, skill: Nature's Wrath, when: Cavalry in a full column}
    - {type: active, skill: Lightning Blade, when: Armored first}
    - {type: active, skill: Mirage Stab, when: When needed}
    - {type: passive, skill: Sylphic Barrier, when: Ally with lowest evasion}
  - name: Monica
    class: Sainted Knight
    row: back
    equipment: [Dragonbone Blade, Dragonbone Shield, Monk's Mitre, First Aid Kit]
    tactics:
    - {type: active, skill: Row Heal, when: Anyone below 75% HP}
    - {type: active, skill: Saint's Blade, when: Lowest HP enemy}
    - {type: active, skill: Row Heal, when: Anyone not at full HP}
    - {type: passive, skill: Quick Heal, when: '75% HP or less, own PP 3 or more'}
    - {type: passive, skill: Row Barrier, when: Magic attacks}
    - {type: passive, skill: Magic Barrier, when: Magic attacks}
    - {type: passive, skill: First Aid, when: None}
  start:
    keep: {unit: Berengaria, skill: Eye of the Warrior Princess}
    'off':
    - {unit: Virginia, skill: Iron Veil}
- title: '5. Rosalinde: Elemental Roar'
  about: Rosalinde's Elemental Roar ignores Magic Reflect, so this squad breaks the Radiant Knights and Sainted Knights that shut down other mages. Ithilion's Frostbrand Tome freezes the enemy for bonus damage. Ilenia carries two shields and covers the back row.
  units:
  - name: Ilenia
    class: Valkyria
    row: front
    equipment: [Notos' Sword, Nameless Guard's Shield, Holy Knight's Shield, Retaliation Earrings]
    tactics:
    - {type: active, skill: Attack, when: Lowest HP enemy}
    - {type: passive, skill: Radiant Cover, when: Lowest HP ally}
  - name: Ithilion
    class: Elven Fencer
    row: front
    equipment: [Spellsteel Sword, Frostbrand Tome, Necromancer's Lantern, Lapis Pendant]
    tactics:
    - {type: active, skill: Lightning Blade, when: Armored}
    - {type: passive, skill: Ice Conferral, when: Target Rosalinde}
    - {type: passive, skill: Vanitas, when: None}
  - name: Rosalinde
    class: Elven Augur
    row: back
    equipment: [Kingslance Elhal, Ruby Pendant, Sage's Hood, Sorcerer's Medallion]
    tactics:
    - {type: active, skill: Elemental Roar, when: None}
    - {type: active, skill: Primus Edge, when: Lowest HP enemy}
    - {type: passive, skill: Rage of the Faeries, when: Start of battle}
    - {type: passive, skill: Elemental Impetus, when: None}
  - name: Magellan
    class: Landsknecht
    row: back
    equipment: [Dragonbone Blade, Golden Ram Shield, Clearsight Amulet, Blue Spectacles]
    tactics:
    - {type: active, skill: Killing Chain, when: Lowest HP enemy}
    - {type: active, skill: Heavy Slash, when: None}
    - {type: passive, skill: Following Slash, when: None}
  - name: Galadmir
    class: Elven Archer
    row: back
    equipment: [Interrogator's Bow, Charm of Warding, Sage's Hood, Awakening Amulet]
    tactics:
    - {type: active, skill: Attack, when: Flying}
    - {type: active, skill: Attack, when: Lowest HP enemy}
  start:
    keep: {unit: Rosalinde, skill: Rage of the Faeries}
    'off':
    - {unit: Ilenia, skill: Iron Veil}
- title: '6. Amalia: Leaping Slash'
  about: Amalia attacks over and over with Leaping Slash from the Dancer's Delight. A critical Leaping Slash gives back the 1 AP it cost, and every Leaping Slash gives her a crit-rate debuff, which sets off the Druid's Robes' Cursed Impetus for +1 AP. Chloe's Keen Call makes each attack a guaranteed crit, and the Wereowl's Restore refills Chloe's PP so she can keep calling. Hodrick covers Amalia and Sharon heals.
  units:
  - name: Hodrick
    class: Legionnaire
    row: front
    equipment: [Zenoiran Knight's Spear, Hero's Greatshield, Knight's Medallion, Salamander Ring]
    tactics:
    - {type: active, skill: Row attack, when: Row with 2 or more enemies}
    - {type: passive, skill: Heavy Cover, when: Target Amalia}
    - {type: passive, skill: Heavy Cover, when: Lowest HP ally}
  - name: Amalia
    class: Dreadnought
    row: front
    equipment: [Dancer's Delight, Champion's Towershield, Druid's Robes, Sapphire Pendant]
    tactics:
    - {type: active, skill: Leaping Slash, when: Lowest HP enemy}
    - {type: active, skill: Leaping Slash, when: None}
    - {type: passive, skill: Cursed Impetus, when: None}
  - name: Chloe
    class: Sergeant
    row: back
    equipment: [Thorn Spear, Lapis Pendant, Royal Scarf, Cloth Gauntlets]
    tactics:
    - {type: active, skill: Long Thrust, when: Full column}
    - {type: passive, skill: Keen Call, when: Target Amalia}
  - name: Generic Wereowl
    class: Wereowl
    row: back
    equipment: [Wingcrest Staff, Lapis Pendant, Royal Scarf, Gold Bangle]
    tactics:
    - {type: active, skill: Night Vision, when: Front row}
    - {type: active, skill: Aurora Veil, when: None}
    - {type: passive, skill: Restore, when: Target Chloe}
  - name: Sharon
    class: Bishop
    row: back
    equipment: [Cleric's Cane, Awakening Amulet, Gold Circlet, Lapis Pendant]
    tactics:
    - {type: active, skill: Row heal, when: Anyone below 75% HP}
    - {type: passive, skill: Dispel, when: Buffed enemy}
  start:
    keep: null
    'off':
    - {unit: Amalia, skill: Provoking Wall}
    note: Amalia's Provoking Wall costs 2 PP that she needs for Cursed Impetus.
  notes: Amalia's Hawk Eye, Heavy Guard and Wild Kick are off so all her PP goes to Cursed Impetus. Each point of her PP is one more Leaping Slash. Each Keen Call makes a Slash free, since the crit refunds its AP. PP caps at 4, so Amalia, Chloe and the Wereowl add up to 12 extra Slashes on top of her own AP. Turn off Chloe's First Aid and Active Gift so her PP goes to Keen Call.
- title: '7. Nigel and Alcina: Venom Stun'
  about: Alcina poisons a row with Aqua Venom, and Nigel's Death Spin hits that row with +75 potency against afflicted enemies and stuns it. Every Advance Cover gives Nigel another AP for more spins. Gilbert's Offensive Order raises the squad's attack and his Inspiration makes Aramis's Meteor Slash, a nine-hit crit flurry, crit harder. Sniping Order makes the front row's next attacks truestrikes. Charged Impetus gives Aramis his AP back, and Primm's Active Heal gives him one more. Alcina's Ominous Wall blocks one attack on every ally at the start of battle.
  units:
  - name: Nigel
    class: Dark Marquess
    row: front
    equipment: [Sacral Sword, Unyielding Greatshield, Leaf Broach, Lapis Pendant]
    tactics:
    - {type: active, skill: Death Spin, when: Afflicted}
    - {type: active, skill: Inferno, when: Row with 2 or more enemies}
    - {type: passive, skill: Advance Cover, when: Lowest HP ally}
    - {type: passive, skill: Phantom Counter, when: None}
  - name: Aramis
    class: Swordmaster
    row: front
    equipment: [Zenoiran Knight's Sword, Hunter's Claymore, Veteran's Eyepatch, Lapis Pendant]
    tactics:
    - {type: active, skill: Meteor Slash, when: None}
    - {type: active, skill: Keen Edge, when: Lowest HP enemy}
    - {type: passive, skill: Charged Impetus, when: None}
    - {type: passive, skill: Parry, when: None}
  - name: Gilbert
    class: Prince
    row: front
    equipment: [Kingsblade Cornix, Scarlet Crest Shield, Dove Plume, Gambler's Coin]
    tactics:
    - {type: active, skill: Offensive Order, when: First action}
    - {type: active, skill: Banishing Stab, when: Buffed enemy}
    - {type: passive, skill: Inspiration, when: Target Aramis}
    - {type: passive, skill: Sniping Order, when: None}
  - name: Alcina
    class: Dark Marquess
    row: back
    equipment: [Meteorite Rod, Dragonbone Greatshield, Sorcerer's Medallion, Lapis Pendant]
    tactics:
    - {type: active, skill: Aqua Venom, when: Row with most enemies}
    - {type: active, skill: Maelstrom, when: None}
    - {type: passive, skill: Ominous Wall, when: Start of battle}
    - {type: passive, skill: Cursed Gaol, when: None}
  - name: Primm
    class: Bishop
    row: back
    equipment: [Lyrical Wand, Awakening Amulet, Gold Circlet, Lapis Pendant]
    tactics:
    - {type: active, skill: Active Heal, when: Target Aramis}
    - {type: active, skill: Row heal, when: Anyone below 75% HP}
    - {type: passive, skill: Refresh, when: Afflicted ally}
  start:
    keep: {unit: Alcina, skill: Ominous Wall}
    'off':
    - {unit: Gilbert, skill: Rapid Order}
    - {unit: Aramis, skill: Hastened Strike}
  notes: Alcina acts before Nigel in most fights, so his first Death Spin lands on a row she has already poisoned. Maelstrom hits every enemy and gets +25 potency against poisoned ones. Gilbert's Gambler's Coin fires Inspiration once per battle, so aim it at Meteor Slash.
- title: '8. Gloucester: Doom Knight Cavalry'
  about: TitaniumLegman's Ajax squad with Gloucester as the Doom Knight. Clive and Renault use Cavalier Call before Gloucester acts, so his Dark Flame starts at +40% attack, then Knight's Pursuit follows up on everything he hits. Both carry Angel Hunter's Bucklers to block flyers. Eltolinde heals and buffs the squad, and Miriam shields it from magic.
