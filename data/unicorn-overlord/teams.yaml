  start:
    keep: {unit: Eltolinde, skill: Boon of the Faeries}
- title: '9. Bruno and Elgor: Burn Squad'
  about: |-
    Everything here sets enemies on fire. Elgor is fast, so he usually acts first and Flame Thrust burns a front and back enemy in one column. Bruno's Wide Smash hits a row, and Auch's Flamebrand Tome adds Burn to it. Selvie burns a row with Fire Curse, Auch burns with Fireball and Volcano, and Berenice's Searing Rapier burns whatever is left. Berenice also follows up every ally attack with Following Slash. At the end of each battle, the Chlorotic Wand's Fire Burst hits every enemy if its target is burning.

    Elgor tanks by dodging. At the start of battle, Dead Booing pulls every enemy attack onto him and lets him dodge the first 2 hits. Dark Step dodges another hit, and the Royal Scarf pushes his evasion past his already high base. The Gran Baris covers the hits he doesn't dodge with the best defense and guard rate a greatshield gets, and its debuff immunity stops enemies from lowering his evasion. It uses no PP, so all of his goes to Dark Step. The Sacral Axe makes Bruno immune to stun and other afflictions, and heals him on every active skill.
  units:
  - name: Bruno
    class: Berserker
    row: front
    equipment: [Sacral Axe, Leaf Broach, Hero's Medallion, Lapis Pendant]
    tactics:
    - {type: active, skill: Wide Smash, when: None}
    - {type: passive, skill: Bulk Up, when: Own HP below 75%}
  - name: Berenice
    class: Landsknecht
    row: front
    equipment: [Searing Rapier, Blessed Round Shield, Elite Beret, Warrior's Medallion]
    tactics:
    - {type: active, skill: Fire Slash, when: Not burning}
    - {type: active, skill: Bastard's Cross, when: Highest HP enemy}
    - {type: passive, skill: Following Slash, when: None}
  - name: Elgor
    class: Dark Marquess
    row: front
    equipment: [Thorn Spear, Gran Baris, Royal Scarf, Lapis Pendant]
    tactics:
    - {type: active, skill: Flame Thrust, when: 'Full column, not burning'}
    - {type: active, skill: Dark Mist, when: Own PP 1 or less}
    - {type: active, skill: Flame Thrust, when: Not burning}
    - {type: active, skill: Deadly Rush, when: None}
    - {type: passive, skill: Dead Booing, when: Start of battle}
    - {type: passive, skill: Dark Step, when: None}
    - {type: passive, skill: Evil Cover, when: Ally below 50% HP}
  - name: Auch
    class: Warlock
    row: back
    equipment: [Chlorotic Wand, Flamebrand Tome, Sorcerer's Medallion, Lapis Pendant]
    tactics:
    - {type: active, skill: Volcano, when: Full column}
    - {type: active, skill: Fireball, when: None}
    - {type: passive, skill: Flame Conferral, when: Target Bruno}
