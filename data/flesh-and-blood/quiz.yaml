  # --- Turns & priority (added 2026-11-21) ---
  - id: r46
    topic: turns
    q: There are two layers on the stack, and both players pass priority in succession without doing anything. What happens?
    choices:
      - The top layer resolves, then the turn-player gets priority
      - Both layers resolve, then the turn-player gets priority
      - The top layer resolves, then the player who controlled it gets priority
      - The step ends and both layers are cleared
    answer: 0
    why: When everyone passes in a row with something on the stack, only the top layer resolves. After a layer resolves, the turn-player gets priority.
    cite: CR 1.11.3, 1.11.4a

  - id: r47
    topic: turns
    q: In the action phase, the stack is empty and the combat chain is closed. Both players pass priority in succession. What happens?
    choices:
      - The action phase ends and the game goes to the End Phase
      - The turn-player gets 1 more action point
      - The turn-player gets priority again
      - The turn ends without an End Phase
    answer: 0
    why: With an empty stack and a closed combat chain, everyone passing ends the action phase. The End Phase comes next.
    cite: CR 4.3.4

  - id: r48
    topic: turns
    q: A "beginning of the end phase" trigger goes on the stack. Can the non-turn-player play an instant in response?
    choices:
      - No. No one gets priority in the End Phase.
      - Yes, but only a defense reaction
      - Yes. Anyone can respond to a triggered layer.
      - Only if the trigger targets them
    answer: 0
    why: Players don't get priority in the End Phase. Its layers resolve as if everyone passed, until the stack is empty.
    cite: CR 4.4.1, 4.4.2

  - id: r49
    topic: turns
    q: You play an attack action card. Once it's played, who gets priority?
    choices:
      - You do
      - Your opponent does
      - No one, until the card resolves
      - Whoever has fewer cards in hand
    answer: 0
    why: A player who plays a card or activates an ability gets priority back once it has been played or activated.
    cite: CR 1.11.5

  - id: r50
    topic: turns
    q: During the start-of-game procedure, two "start of the game" triggers are created at once. Who chooses the order they go on the stack?
    choices:
