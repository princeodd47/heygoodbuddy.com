    topic: interactions
    q: An Earth Bond card says you have to pitch an Earth card to pay for it. You already pitched an Earth card earlier this turn and have resources left from it. Is the bond met?
    choices:
      - No. You have to pitch the Earth card while paying for this card.
      - Yes. Floating resources from an Earth card count.
      - Yes, if it was pitched this turn.
      - Only if the floating resources pay the whole cost.
    answer: 0
    why: Bond checks the cards pitched while paying for this specific card.
