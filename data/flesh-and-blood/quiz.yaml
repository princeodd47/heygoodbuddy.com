# Practice questions for the Flesh and Blood judge study quiz.
# topic: rules | interactions (L1A) or policy | tournament (L1B).
# answer is the index into choices; the quiz shuffles choices when shown.
# cards (optional) lists card ids from cards.csv to show with the question;
# run .venv/bin/python scripts/fab_cards.py after changing them.
# Checked against the CR, PPG and TRP on 2026-10-27.

topics:
  rules: Rules
  interactions: Card interactions
  policy: Penalties
  tournament: Tournament rules

questions:
  # --- Rules (L1A) ---
  - id: r01
    topic: rules
    q: One effect says "You can't play cards from your banished zone." Another says "You may play cards from your banished zone." Can the player play a card from their banished zone?
    choices:
      - No. A restriction beats an allowance.
      - Yes. The newer effect wins.
      - Yes. An allowance beats a restriction.
      - The turn-player decides which effect applies.
    answer: 0
    why: A restriction ("can't") beats a requirement ("must"), which beats an allowance ("may").
    cite: CR 1.0.2

  - id: r02
    topic: rules
    q: A tournament rule, a card effect and the Comprehensive Rules all disagree. Which one wins?
    choices:
      - The tournament rule
      - The card effect
      - The Comprehensive Rules
      - Whichever was published most recently
    answer: 0
    why: Card effects override the CR, and tournament rules override both.
    cite: CR 1.0.1a–b

  - id: r03
    topic: rules
    q: An attack is already defended by two action cards. It then gains overpower. What happens to the defenders?
    choices:
      - Both stay. Restrictions aren't retroactive.
      - The defending player removes one of them.
      - The attacking player removes one of them.
      - Both are removed from the chain link.
    answer: 0
    why: Overpower only stops more action cards being added. It doesn't undo defenders already declared.
    cite: CR 1.0.2b, 8.3.22b

  - id: r04
    topic: rules
    q: An attack with dominate is defended by one card from hand. Which of these can the defending player still do?
    choices:
      - Play a defense reaction from their arsenal
      - Play a defense reaction from their hand
      - Add a second card from hand with an effect
      - Nothing. Dominate locks out every other defender.
    answer: 0
    why: Dominate only limits cards coming from hand. Arsenal cards and equipment aren't from hand.
    cite: CR 8.3.4a–b

  - id: r05
    topic: rules
    q: In which combat step do players NOT get priority?
    choices:
      - Close Step
      - Damage Step
      - Resolution Step
      - Layer Step
    answer: 0
    why: The combat chain closes with no priority. Players also get no priority in the start and end phases.
    cite: CR 7.7.1, 1.11.3

  - id: r06
    topic: rules
    q: During your opponent's turn, you play an action card with go again as an instant. What do you gain from go again?
    choices:
      - Nothing. You can only gain action points in your own action phase.
      - 1 action point, which you keep until your turn
      - 1 action point, which you lose at the end of the turn
      - 1 resource point instead
    answer: 0
    why: If a player would gain an action point outside their own action phase, they gain nothing.
    cite: CR 1.13.2b

  - id: r07
    topic: rules
    q: A card that already has go again is given go again by another effect. What happens?
    choices:
      - That part of the effect fails. An object can't have go again twice.
      - It gives 2 action points when it resolves.
      - The player chooses which go again to keep.
      - The second go again replaces the first.
    answer: 0
    why: An object can't have more than one go again ability.
    cite: CR 8.3.5c

  - id: r08
    topic: rules
    q: When does an attack with go again give its controller the action point?
    choices:
      - At the start of the Resolution Step
      - When the attack goes on the stack
      - When it hits
      - When the combat chain closes
    answer: 0
    why: The action point for an attack's go again comes when its chain link resolves, at the start of the Resolution Step.
    cite: CR 8.3.5b, 7.6.2

  - id: r09
    topic: rules
    q: In the end-of-turn procedure, which comes first?
    choices:
      - The turn-player may put a card into their arsenal
      - Pitched cards go to the bottom of the deck
      - The turn-player untaps their permanents
      - The turn-player draws up to intellect
    answer: 0
    why: "The order is: allies' life resets, arsenal, pitch to bottom, untap, lose action and resource points, draw."
    cite: CR 4.4.3

  - id: r10
    topic: rules
    q: At the end of the first turn of the game, who draws up to their hero's intellect?
    choices:
      - Every player
      - Only the turn-player
      - Only the player who didn't go first
      - No one. Hands were drawn at the start of the game.
    answer: 0
    why: On the first turn, every player draws up to intellect in the end-of-turn procedure.
    cite: CR 4.4.3f

  - id: r11
    topic: rules
    q: Game 1 of a Swiss match ended in a draw. Who chooses the first player for game 2?
    choices:
      - The same player who chose in game 1
      - The player who didn't choose in game 1
      - It's decided at random again
      - The player with the higher life total at the end of game 1
    answer: 0
    why: Normally the player who lost the last game chooses. After a draw, the same player chooses again.
    cite: CR 4.1.3, TRP 3.3

  - id: r12
    topic: rules
    q: In the start-of-game procedure, when are arena-cards (equipment and weapons) chosen?
    choices:
      - Before the deck is chosen
      - After the deck is shuffled and presented
      - After opening hands are drawn
      - At the same moment as the deck, face down
    answer: 0
    why: "The order is: hero, first player, arena-cards chosen, arena-cards revealed, then the deck chosen."
    cite: CR 4.1.4–4.1.6

  - id: r13
    topic: rules
    q: You have 1 resource point floating and play a card that costs 3. You pitch a blue card (pitch 3). Can you pitch another card?
    choices:
      - No. The cost is paid and 1 resource is left over.
      - Yes. You may pitch as many cards as you like while paying.
      - Yes, but only a red card.
      - No, and the extra resource is lost.
    answer: 0
    why: You can only pitch while you still owe a cost that card would help pay.
    cite: CR 1.14.2d, 1.14.3b

  - id: r14
    topic: rules
    q: A cost includes both chi points and resource points. In what order are they paid?
    choices:
      - Chi, then resources
      - Resources, then chi
      - The player's choice
      - At the same time
    answer: 0
    why: "Asset-costs are paid in this order: chi, resources, life, then action points."
    cite: CR 1.14.2a

  - id: r15
    topic: rules
    q: A card costs 1. Effect A (earlier timestamp) reduces its cost by 2. Effect B (later timestamp) increases its cost by 1. What does it cost?
    choices:
      - "0"
      - "1"
      - "2"
      - "-1"
    answer: 0
    why: Increases apply before reductions whatever their timestamps. 1 + 1 = 2, then -2 = 0.
    cite: CR 5.1.6a

  - id: r16
    topic: rules
    q: What is the action point cost of an action card played as an instant?
    choices:
      - "0"
      - "1"
      - The same as its resource cost
      - It can't be played as an instant
    answer: 0
    why: An action card costs 1 action point unless it's played as an instant.
    cite: CR 5.1.6b

  - id: r17
    topic: rules
    q: "Endless Arrow says \"When this hits, put it into its owner's hand.\" It had go again when it hit. Does the player gain an action point when the chain link resolves?"
    choices:
      - Yes, through last known information
      - No. The card is no longer on the chain.
      - Only if they play it again this turn
      - Only if the opponent agrees
    answer: 0
    cards: [endless-arrow-1]
    why: The chain link keeps the arrow's last known information, including go again.
    cite: CR 1.2.3a

  - id: r18
    topic: rules
    q: A triggered layer is on the stack. The card that created it is destroyed. What happens to the layer?
    choices:
      - It still resolves.
      - It's cleared from the stack.
      - It resolves only if it has no targets.
      - The opponent decides.
    answer: 0
    why: Activated and triggered layers exist separately from their source.
    cite: CR 1.7.1a

  - id: r19
    topic: rules
    q: "A card reads \"Deal 2 damage to target hero. Draw a card.\" Its only target is gone when it resolves. What happens?"
    choices:
      - The damage fails, but the player still draws.
      - The whole card fails to resolve.
      - The damage goes to the controller instead.
      - The player picks a new target.
    answer: 0
    why: Only the targeted effect fails. The rest of the layer still resolves.
    cite: CR 1.8.9, 5.3.4b

  - id: r20
    topic: rules
    q: An attack has 4 {p} and is defended by cards with 4 total {d}. What happens?
    choices:
      - It doesn't hit. Power has to be greater than defense.
      - It hits for 0.
      - It hits for 1.
      - Both players take 0 damage, and "on hit" effects still trigger.
    answer: 0
    why: An attack only hits if its power is greater than the total defense.
    cite: CR 7.5.2

  - id: r21
    topic: rules
    q: A prevention effect prevents all of an attack's damage. Did the attack hit?
    choices:
      - No. A hit needs damage from the hit-event.
      - Yes. It was a hit-event.
      - Yes, but "on hit" effects don't trigger.
      - Only if it had dominate.
    answer: 0
    why: If replacement effects mean the attack deals no damage, it isn't a hit.
    cite: CR 7.5.5b

  - id: r22
    topic: rules
    q: Several replacement effects apply to one damage event. Which type applies first?
    choices:
      - Self/identity replacement
      - Standard replacement
      - Prevention
      - Outcome replacement
    answer: 0
    why: "The order is: self/identity, standard, prevention, the event, then outcome."
    cite: CR 6.5

  - id: r23
    topic: rules
    q: A "prevent the next 3 damage" effect is created after the damage event has already happened. What does it do to that event?
    choices:
      - Nothing. Replacements must exist before the event.
      - It prevents 3 of it retroactively.
      - It gives back 3 life.
      - It prevents the damage only if it was arcane.
    answer: 0
    why: Replacement effects are never retroactive.
    cite: CR 6.4.3

  - id: r24
    topic: rules
    q: "\"Whenever an opponent draws 1 or more cards\" — the opponent draws 3 cards from one effect. How many times does it trigger?"
    choices:
      - Once
      - Three times
      - Twice
      - Not at all
    answer: 0
    why: A multi-event triggers once. It doesn't trigger again for each card.
    cite: CR 1.9.2a

  - id: r25
    topic: rules
    q: An effect would deal 0 arcane damage. Can "when you deal arcane damage" effects trigger?
    choices:
      - No. An instruction to do nothing doesn't happen.
      - Yes. The event still occurred.
      - Only if a replacement raises it above 0
      - Only for the turn-player
    answer: 0
    why: Dealing 0 damage isn't an event. It can't be replaced and doesn't trigger anything.
    cite: CR 1.9.1b

  - id: r26
    topic: rules
    q: A player is told to search their deck for a specific card. They have one, but say they don't find it. Is that allowed?
    choices:
      - Yes. The opponent can't verify the deck, so they may fail to find.
      - No. That's a Game Rules Violation.
      - Only if the card is a token.
      - Only in Casual events.
    answer: 0
    why: If the opponent can't verify an instruction failed, the player may choose to fail it.
    cite: CR 1.9.1c

  - id: r27
    topic: rules
    q: A resolved layer creates a continuous effect with no stated duration. When does it end?
    choices:
      - At the end of the turn
      - When the combat chain closes
      - At the start of its controller's next turn
      - It never ends
    answer: 0
    why: Layer-continuous effects with no stated duration end at end of turn.
    cite: CR 6.2.2a

  - id: r28
    topic: rules
    q: An attack has base 3 {p}. It gets +2 {p} first. Later, an effect sets its power to 1. What is its power?
    choices:
      - "3"
      - "1"
      - "5"
      - "6"
    answer: 0
    why: 'Set effects apply before add effects whatever their timestamps. 1 + 2 = 3.'
    cite: CR 6.3.3

  - id: r29
    topic: rules
    q: Several triggered layers are created at the same time for both players. Who decides the order they go on the stack?
    choices:
      - The turn-player picks a player to start. Then each player, clockwise, adds their own in any order.
      - The turn-player orders all of them.
      - They go on in timestamp order.
      - The non-turn-player orders all of them.
    answer: 0
    why: The turn-player chooses who starts. Then each player adds their own triggers in the order they choose.
    cite: CR 6.6.6b

  - id: r30
    topic: rules
    q: Heave reads "you may pay {r}{r}{r} and put this face-up into your arsenal". Your arsenal is full. Can you choose to heave?
    choices:
      - No. You can't choose an optional effect you can't fully carry out.
      - Yes. You pay and the card stays in hand.
      - Yes, but you don't pay.
      - Only if you have 3 resources floating.
    answer: 0
    why: If any part of an optional effect can't happen, or its cost can't be paid, you can't choose it.
    cite: CR 1.8.3b

  - id: r31
    topic: rules
    q: You control Spellvoid 2 equipment, but an effect says it can't be destroyed. You'd be dealt arcane damage. Can you use Spellvoid?
    choices:
      - No. If you can't destroy it, you can't use its prevention.
      - Yes. It prevents 2 and stays.
      - Yes. It prevents 2 and is banished instead.
      - Only if you also pay 2 resources.
    answer: 0
    why: Spellvoid's prevention needs you to destroy the card.
    cite: CR 8.3.15a

  - id: r32
    topic: rules
    q: Which keyword destroys a card when the combat chain closes, if it defended?
    choices:
      - Blade Break
      - Battleworn
      - Guardwell
      - Spellvoid
    answer: 0
    why: Blade Break destroys it. Battleworn adds a -1 defense counter. Temper adds a counter and destroys it at 0. Guardwell adds counters equal to its defense.
    cite: CR 8.3.2–8.3.3

  - id: r33
    topic: rules
    q: A player with no cards in hand is intimidated. Are they considered intimidated?
    choices:
      - Yes, even though nothing was banished
      - No. Intimidate fails with an empty hand.
      - Only if they have a card in arsenal
      - Only for "when intimidated" effects they control
    answer: 0
    why: The player counts as intimidated even if they banished nothing.
    cite: CR 8.5.10a

  - id: r34
    topic: rules
    q: A player is told to opt 3, but only 2 cards are left in their deck. What happens?
    choices:
      - They look at both and put them back in any order.
      - The opt fails.
      - They lose the game.
      - They look at 2, then shuffle the deck.
    answer: 0
    why: With fewer than N cards, the player looks at all of them. Opt only fails with an empty deck.
    cite: CR 8.5.22a–b

  - id: r35
    topic: rules
    q: You control two permanents with the same name, and one has unique. What happens?
    choices:
      - As a game state action, you clear down to one, or to none with unique.
      - The second one can't enter the arena.
      - Both are destroyed.
      - Nothing, if they have different pitch values.
    answer: 0
    why: Unique is enforced as a game state action. It's a clear, not a destroy.
    cite: CR 8.3.48a, 1.10.2b

  - id: r36
    topic: rules
    q: How many red Sink Below and yellow Sink Below can a Classic Constructed card-pool have?
    choices:
      - Up to 3 of each. A different pitch makes them different cards.
      - Up to 3 in total
      - Up to 1 of each
      - Up to 2 of each
    answer: 0
    cards: [sink-below-1, sink-below-2]
    why: Cards with a different name or pitch are different cards. CC allows 3 of each.
    cite: CR 1.3.4, TRP 7.1

  - id: r37
    topic: rules
    q: While the combat chain is open, when can the turn-player play an attack action card normally (not as an instant)?
    choices:
      - In the Resolution Step
      - In the Reaction Step
      - Any time they have priority
      - Never while the chain is open
    answer: 0
    why: While the chain is open, actions can only be played as instants, except attacks during the Resolution Step.
    cite: CR 7.0.1a, 7.6.3a

  - id: r38
    topic: rules
    q: An ally is the target of an attack. Can its controller declare defending cards from their hand?
    choices:
      - Not unless an effect allows it
      - Yes, like defending their hero
      - Only equipment
      - Only defense reactions
    answer: 0
    why: Players can only declare defenders from hand and equipment when the attack-target is a hero.
    cite: CR 7.3.2a, 7.4.2b

  - id: r39
    topic: rules
    q: Who is the attacking hero when an ally attacks?
    choices:
      - The ally's controller
      - Nobody. Allies aren't heroes.
      - The ally's owner, even if someone else controls it
      - The defending player
    answer: 0
    why: The controller of the active attack is the attacking hero.
    cite: CR 7.2.3a

  - id: r40
    topic: rules
    q: Both heroes are reduced to 0 life at the same time. What is the result?
    choices:
      - The game is a draw
      - The turn-player loses
      - The non-turn-player loses
      - The player who dealt the damage wins
    answer: 0
    why: If all remaining heroes hit 0 at the same time, the game is a draw.
    cite: CR 4.5.4a

  - id: r41
    topic: rules
    q: An effect calculates -3.5. What number is used?
    choices:
      - "-3"
      - "-4"
      - "0"
      - "-3.5"
    answer: 0
    why: Fractions round toward zero.
    cite: CR 1.12.1a

  - id: r42
    topic: rules
    q: A card's text refers to "you", but the card has no controller (it was revealed in a clash). Who is "you"?
    choices:
      - Its owner
      - The turn-player
      - Nobody. The effect fails.
      - The player who won the clash
    answer: 0
    why: With no controller, "you" means the owner.
    cite: CR 1.1.2b

  - id: r43
    topic: rules
    q: Ironsong Determination gives a weapon +1 power. The weapon then attacks. Does the attack-proxy have the +1?
    choices:
      - Yes. The proxy inherits the weapon's modified properties.
      - No. The effect only applies to the weapon card.
      - Only if it was applied after the attack.
      - Only for the first attack this turn.
