      - Both defend, because neither was declared in the Defend Step
      - Neither defends
      - The defender chooses which one defends, and the other goes back to hand
    answer: 0
    why: The second one to be played is on top, so it resolves first and becomes a defending card from hand. Dominate then stops the other from defending, and a defense reaction that can't become a defending card fails to resolve.
    cite: CR 7.4.2d, 8.3.4a–b

