  - id: r45
    topic: rules
    q: A card says "choose 3 if you've played another blue card this turn, otherwise choose 1". When is the number of modes decided?
    choices:
      - When the card is played and modes are declared
      - When the card resolves
      - At the start of the turn
      - When an opponent responds
    answer: 0
    why: Modes, and how many can be chosen, are fixed as the card goes on the stack.
    cite: CR 1.7.5a, 1.7.5e

  # --- Card interactions (L1A) ---
  - id: i01
    topic: interactions
    q: Predatory Plating says "Instant — Destroy this. Gain resources. Activate only if you control a card with 6 or more {p}." Can you activate it partway through playing a 6 {p} card, to pay that card's cost?
    choices:
      - No. No one has priority while a card is being played.
      - Yes. The card is on the stack, so you control it.
      - Yes, but only during the Pay Asset-Costs step.
      - Only if the card is in your arsenal.
    answer: 0
    cards: [predatory-plating]
    why: Activating an instant ability needs priority, and there is none during the steps of playing a card.
    cite: CR 1.11.5, 5.2.2; Compendium of Rathe release notes

  - id: i02
    topic: interactions
    q: A quickstrike attack ("If this has go again, +1 power and 'when this attacks a hero, …'") gets go again after it's already attacking. What does it get?
    choices:
      - The +1 power, but the "when this attacks" trigger doesn't fire
      - Both the +1 and the trigger
      - Neither. Quickstrike is checked only when the card is played.
      - Only the trigger
    answer: 0
    why: The condition now applies, but a trigger moment that has passed doesn't fire.
    cite: CR 6.6.5a; Omens of the Third Age release notes

  - id: i03
    topic: interactions
    q: A card reads "Deal 2 arcane damage. Deal 2 arcane damage." Can you use Starflow Robes between the two damage instructions?
    choices:
      - No. The card fully resolves before anyone gets priority.
      - Yes. Each damage instruction is a separate event.
      - Yes, but only to prevent the second instruction.
      - Only if you're the turn-player.
    answer: 0
    cards: [starflow-robes]
    why: No one has priority while a layer is resolving.
    cite: CR 1.11.5; Omens of the Third Age release notes

  - id: i04
    topic: interactions
    q: Constella Tiara prevents damage. Can it stop "lose 2 life"?
    choices:
      - No. Prevention stops damage, not loss of life.
      - Yes. Life loss is untyped damage.
      - Only if it's caused by an attack
      - Only arcane life loss
    answer: 0
    cards: [constella-tiara]
    why: Losing life isn't damage, so prevention effects don't apply to it.
    cite: Omens of the Third Age release notes

  - id: i05
    topic: interactions
    q: Touch of Reality is activated with X = 0, so it gets Ward 0. If you use that Ward on a damage event, is it destroyed?
    choices:
      - Yes. Applying Ward destroys it, even though it prevents 0.
      - No. Ward 0 does nothing.
      - Only if damage was prevented.
      - It's banished instead.
    answer: 0
    cards: [touch-of-reality]
    why: Applying a Ward prevention means destroying the card, whatever N is.
    cite: CR 8.3.20; Compendium of Rathe release notes

