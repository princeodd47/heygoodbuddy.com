# Lufia II walkthrough extras: each chapter's treasure and enemies, shown in
# a box at the end of the chapter on docs/games/lufia-ii/walkthrough.md.
# Keys are the chapter titles (the page's "##" headings), exactly.
#
# areas: Bestiary areas (data/lufia-ii/bestiary.yaml) whose regular enemies
#   are listed, each linking to the Bestiary filtered to that area.
# treasure: groups of chests, by place. i is the item, n how to get it.
# also: other pickups in the chapter that aren't chests.
#
# Chests from Iron Knuckle's GameFAQs walkthrough, checked against
# RPGClassics' treasure list.
chapters:
  "Elcid and the Secret Skills Cave":
    areas: ["Secret Skills Cave", "Overworld: Elcid"]
    also: ["Restart skill (Secret Skills Cave)"]

  "Cave to Sundletan":
    areas: ["Cave to Sundletan"]
    treasure:
      - place: "Cave to Sundletan"
        items:
          - {i: "Antidote"}
          - {i: "Escape"}
          - {i: "Hide Armor"}
          - {i: "Life Potion"}
          - {i: "Magic Jar"}
          - {i: "Power Potion"}
          - {i: "Dragon Egg", n: "Needs the Hook. Come back after the Gordovan West Tower."}

