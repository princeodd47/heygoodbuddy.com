          - {i: "Miracle", n: "In the grassy room, walk through the left wall."}
          - {i: "Power Potion"}
          - {i: "Speedy Ring", n: "Beat every monster in the corridor."}
    also: ["Jelze, capsule monster (Foomy Woods)"]

