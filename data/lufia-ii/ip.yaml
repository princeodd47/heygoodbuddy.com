# Lufia II IP attacks: what each does and which gear has it. Effects from
# RPGClassics' Lufia 2 shrine (IP list) and Almar's Guides, reworded. The gear
# lists come from data/lufia-ii/equipment.yaml, so names match the Equipment
# page; "gear" here is only for IPs on gear that file doesn't list.
# Grouped for the Magic and IP page.
groups:
  - type: "Attacks"
    ips:
      - {name: "Water Attack", element: "Water", effect: "1.5× damage to one enemy, more against water-weak enemies."}
      - {name: "Flame Attack", element: "Fire", effect: "1.5× damage to one enemy, more against fire-weak enemies."}
      - {name: "Ice Attack", element: "Ice", effect: "1.5× damage to one enemy, more against ice-weak enemies."}
