site_name: heygoodbuddy.com
site_url: https://heygoodbuddy.com/
site_description: Flesh and Blood rules study and articles.

# Local preview port. 8080 on levia belongs to levia-web (network-config), so never use it here.
dev_addr: 127.0.0.1:8000

theme:
  name: material
  # Template overrides (page-by-page field guide look; see overrides/main.html).
  custom_dir: overrides
  # Dark only: the field guide look (docs/stylesheets/field-guide.css) has
  # no light version.
  palette:
    scheme: slate
    primary: deep purple
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.tabs.link

plugins:
  - search
  - blog
  - tags
  - macros:
      include_yaml:
        fab_quiz: data/flesh-and-blood/quiz.yaml
        fab_icons: data/flesh-and-blood/icons.yaml
        fab_my_rulings: data/flesh-and-blood/my-rulings.yaml
        fab_cards: data/flesh-and-blood/cards.yaml

extra_css:
  - stylesheets/extra.css
  - stylesheets/field-guide.css?v=2026-11-17.18
  - stylesheets/fab.css?v=2026-10-28.2

extra_javascript:
  - javascripts/fab-cards.js?v=2026-10-28.2
  - javascripts/fab-quiz.js?v=2026-11-21.1
  - javascripts/fg-tables.js?v=2026-11-16.7
  - javascripts/fg-search.js?v=2026-11-17.9
  - javascripts/fg-pages.js?v=2026-11-17.15

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  # Files stay under docs/games/flesh-and-blood/ so the old URLs keep working.
  - Flesh and Blood:
      - games/flesh-and-blood/index.md
      - Rules: games/flesh-and-blood/rules.md
      - Turns & Priority: games/flesh-and-blood/turns.md
      - Playing Cards: games/flesh-and-blood/playing-cards.md
      - Effects: games/flesh-and-blood/effects.md
      - Combat: games/flesh-and-blood/combat.md
      - Keywords: games/flesh-and-blood/keywords.md
      - Policy & Penalties: games/flesh-and-blood/policy.md
      - Tournament Rules: games/flesh-and-blood/tournament.md
      - Card Interactions: games/flesh-and-blood/interactions.md
      - Scorekeeping: games/flesh-and-blood/scorekeeping.md
      - Practice Quiz: games/flesh-and-blood/quiz.md
      - Glossary: games/flesh-and-blood/glossary.md
  - Articles:
      - blog/index.md
  - Tags: tags.md
