extra_css:
  - stylesheets/extra.css
  - stylesheets/field-guide.css?v=2026-11-17.18
  - stylesheets/dqm.css
  - stylesheets/synth-builder.css
  - stylesheets/fab.css?v=2026-10-28.2
  - stylesheets/mnd-cards.css?v=2026-11-22.1

extra_javascript:
  - javascripts/synth-builder.js
  - javascripts/dqm-monsters.js
  - javascripts/dqm-talents.js
  - javascripts/fab-cards.js?v=2026-10-28.2
  - javascripts/fab-quiz.js?v=2026-11-21.1
  - javascripts/fg-tables.js?v=2026-11-16.7
  - javascripts/fg-search.js?v=2026-11-17.9
  - javascripts/fg-pages.js?v=2026-11-17.15
  - javascripts/fg-cards.js?v=2026-11-21.1
  - javascripts/mnd-cards.js?v=2026-11-22.1

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

