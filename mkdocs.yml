site_name: heygoodbuddy.com
site_url: https://heygoodbuddy.com/
site_description: Game guides, notes and articles.

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.tabs.link

plugins:
  - search
  - blog
  - tags
  - macros:
      include_yaml:
        ffr: data/final-fantasy-resonance/visions.yaml
        ffr_bestiary: data/final-fantasy-resonance/bestiary.yaml
        dqm: data/dragon-quest-monsters-the-withered-world/monsters.yaml
        dqm_synth: data/dragon-quest-monsters-the-withered-world/synthesis.yaml
        dqm_talents: data/dragon-quest-monsters-the-withered-world/talents.yaml
        dqm_abilities: data/dragon-quest-monsters-the-withered-world/abilities.yaml
        dqm_items: data/dragon-quest-monsters-the-withered-world/items.yaml
        ffxii_monographs: data/final-fantasy-xii-the-zodiac-age/monographs.yaml
        ffxii_bazaar: data/final-fantasy-xii-the-zodiac-age/bazaar.yaml
        dqmch_dungeons: data/dragon-quest-monsters-caravan-heart/dungeons.yaml
        rudras_monsters: data/treasure-of-the-rudras/monsters.yaml
        rudras_bosses: data/treasure-of-the-rudras/bosses.yaml
        rudras_equipment: data/treasure-of-the-rudras/equipment.yaml
        lufia2_bestiary: data/lufia-ii/bestiary.yaml
        lufia2_equipment: data/lufia-ii/equipment.yaml
        lufia2_items: data/lufia-ii/items.yaml
        sf_bestiary: data/shining-force/bestiary.yaml
        sf_equipment: data/shining-force/equipment.yaml
        sf_items: data/shining-force/items.yaml
        fab_quiz: data/flesh-and-blood/quiz.yaml
        fab_icons: data/flesh-and-blood/icons.yaml
        fab_my_rulings: data/flesh-and-blood/my-rulings.yaml
        fab_cards: data/flesh-and-blood/cards.yaml

extra_css:
  - stylesheets/extra.css
  - stylesheets/dqm.css
  - stylesheets/synth-builder.css
  - stylesheets/fab.css?v=2026-10-28.2

extra_javascript:
  - javascripts/synth-builder.js
  - javascripts/dqm-monsters.js
  - javascripts/dqm-talents.js
  - javascripts/fab-cards.js?v=2026-10-28.2
  - javascripts/fab-quiz.js?v=2026-10-28.2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Games:
      - games/index.md
      - Final Fantasy Resonance:
          - games/final-fantasy-resonance/index.md
          - Visions: games/final-fantasy-resonance/visions.md
          - Tablet Shards: games/final-fantasy-resonance/tablet-shards.md
