site_name: heygoodbuddy.com
site_url: https://heygoodbuddy.com/
site_description: Game guides, notes and articles.

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.tabs.link

plugins:
  - search
  - blog
  - tags
  - macros:
      include_yaml:
        ffr: data/final-fantasy-resonance/visions.yaml
        ffr_bestiary: data/final-fantasy-resonance/bestiary.yaml
        dqm: data/dragon-quest-monsters-the-withered-world/monsters.yaml
        dqm_synth: data/dragon-quest-monsters-the-withered-world/synthesis.yaml
        dqm_talents: data/dragon-quest-monsters-the-withered-world/talents.yaml
        dqm_abilities: data/dragon-quest-monsters-the-withered-world/abilities.yaml
        dqm_items: data/dragon-quest-monsters-the-withered-world/items.yaml
        ffxii_monographs: data/final-fantasy-xii-the-zodiac-age/monographs.yaml
        ffxii_bazaar: data/final-fantasy-xii-the-zodiac-age/bazaar.yaml
        dqmch_dungeons: data/dragon-quest-monsters-caravan-heart/dungeons.yaml

extra_css:
  - stylesheets/extra.css
  - stylesheets/dqm.css
  - stylesheets/synth-builder.css

extra_javascript:
  - javascripts/synth-builder.js
  - javascripts/dqm-monsters.js
  - javascripts/dqm-talents.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Games:
      - games/index.md
      - Final Fantasy Resonance:
          - games/final-fantasy-resonance/index.md
          - Visions: games/final-fantasy-resonance/visions.md
          - Tablet Shards: games/final-fantasy-resonance/tablet-shards.md
          - Bestiary: games/final-fantasy-resonance/bestiary.md
          - Espers: games/final-fantasy-resonance/espers.md
      - Dragon Quest Monsters The Withered World:
          - games/dragon-quest-monsters-the-withered-world/index.md
          - Starting Monsters: games/dragon-quest-monsters-the-withered-world/starting-monsters.md
          - Monsters: games/dragon-quest-monsters-the-withered-world/monsters.md
          - Synthesis: games/dragon-quest-monsters-the-withered-world/synthesis.md
          - Recipe Builder: games/dragon-quest-monsters-the-withered-world/recipe-builder.md
          - Talents: games/dragon-quest-monsters-the-withered-world/talents.md
          - Items: games/dragon-quest-monsters-the-withered-world/items.md
      - Final Fantasy XII The Zodiac Age:
          - games/final-fantasy-xii-the-zodiac-age/index.md
          - Changes from PS2: games/final-fantasy-xii-the-zodiac-age/changes.md
          - New Playthrough: games/final-fantasy-xii-the-zodiac-age/new-playthrough.md
          - Monographs: games/final-fantasy-xii-the-zodiac-age/monographs.md
          - Bazaar: games/final-fantasy-xii-the-zodiac-age/bazaar.md
          - Party: games/final-fantasy-xii-the-zodiac-age/party.md
      - Dragon Quest Monsters Caravan Heart:
          - games/dragon-quest-monsters-caravan-heart/index.md
          - Post-Game: games/dragon-quest-monsters-caravan-heart/post-game.md
          - Orb Dungeons: games/dragon-quest-monsters-caravan-heart/orb-dungeons.md
          - Dungeon Floors: games/dragon-quest-monsters-caravan-heart/dungeon-floors.md
          - Caravan: games/dragon-quest-monsters-caravan-heart/caravan.md
          - Hearts & Reforming: games/dragon-quest-monsters-caravan-heart/hearts.md
  - Articles:
      - blog/index.md
  - Tags: tags.md
