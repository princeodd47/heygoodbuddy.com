site_name: heygoodbuddy.com
site_url: https://heygoodbuddy.com/
site_description: Game guides, notes and articles.

# Local preview port. 8080 on levia belongs to levia-web (network-config), so never use it here.
dev_addr: 127.0.0.1:8000

theme:
  name: material
  # Template overrides (page-by-page field guide look; see overrides/main.html).
  custom_dir: overrides
  # Dark only: the field guide look (docs/stylesheets/field-guide.css) has
  # no light version.
  palette:
    scheme: slate
    primary: deep purple
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.tabs.link

plugins:
  - search
  - blog
  - tags
  - macros:
      include_yaml:
        ffr: data/final-fantasy-resonance/visions.yaml
        ffr_bestiary: data/final-fantasy-resonance/bestiary.yaml
        ffr_equipment: data/final-fantasy-resonance/equipment.yaml
        ffr_items: data/final-fantasy-resonance/items.yaml
        ffr_key_items: data/final-fantasy-resonance/key-items.yaml
        dqm: data/dragon-quest-monsters-the-withered-world/monsters.yaml
