{#-
  Field guide look on every page: html.fg scopes the styles in
  docs/stylesheets/field-guide.css, and the fonts load here.
-#}
{% extends "base.html" %}
{% block extrahead %}
  <script>document.documentElement.classList.add("fg")</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
{% endblock %}
